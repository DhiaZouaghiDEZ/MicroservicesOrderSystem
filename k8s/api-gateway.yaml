apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/dhiazouaghidez/microservicesordersystem/apigateway:sha-3839c4b679e02c8d0aa5ac04995fc92a991f7af4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        env: 
        - name: DOTNET_TieredPGO
          value: "0"
        - name: DOTNET_ReadyToRun
          value: "0"
        - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
          value: "1"
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080