apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        # 1. UPDATE THIS to your exact GHCR URL
        image: ghcr.io/dhiazouaghidez/microservicesordersystem/orderservice:sha-3839c4b679e02c8d0aa5ac04995fc92a991f7af4
        imagePullPolicy: Always # Forces K8s to check GHCR for new images
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ORDER_DB_CONNECTION
        - name: RabbitMq__Host
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RabbitMq__ConnectionString
        - name: InventoryService__Url
          value: "http://inventory-service"
        # .NET 10 JIT Bypasses to prevent 139 Segfaults in Minikube
        - name: DOTNET_TieredPGO
          value: "0"
        - name: DOTNET_ReadyToRun
          value: "0"
        - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
          value: "1"
      # 2. ADD THIS BLOCK to authenticate with GHCR
      imagePullSecrets:
      - name: ghcr-secret